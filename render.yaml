services:
  - type: web
    name: bazarkinun-web
    runtime: docker
    plan: free
    region: singapore # Singapore data center: Fastest latency for Bangladesh (~40ms)
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://bazarkinun.avenor.bond
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: bazarkinun_db
      - key: DB_USER
        value: 3ozXEiRLvxNyLS4.root
      - key: DB_SSL
        value: "true"
      - key: CURL_VERIFY_SSL
        value: "true"
      - key: DB_PASS
        sync: false
